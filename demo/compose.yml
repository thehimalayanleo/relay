name: relay-two-user-demo

services:
  user1:
    build:
      context: ..
      dockerfile: demo/Dockerfile.user1
    environment:
      RELAY_SERVER: ${RELAY_SERVER:-http://host.docker.internal:4317}
      RELAY_RECEIVER_ORIGIN: ${RELAY_RECEIVER_ORIGIN:-http://127.0.0.1:4317}
      RELAY_DEMO_OUT: /demo/out
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./out:/demo/out
    labels:
      relay.demo.role: user-1-docker
